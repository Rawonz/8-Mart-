<!doctype html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>8 Mart Məktubu 🌸</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; color-scheme: dark; }
    body {
      min-height: 100vh;
      background: #08040c;
      font-family: 'DM Sans', ui-sans-serif, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }
    input, textarea, button, a { -webkit-tap-highlight-color: transparent; font-family: inherit; }
    ::selection { background: rgba(224,107,164,0.35); color: #fff7fb; }
    #root { min-height: 100vh; }

    /* ── Live Wallpaper Canvas ── */
    #wallpaper-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* ── Mouse particles overlay ── */
    #mouse-particles {
      position: fixed;
      inset: 0;
      z-index: 9999;
      pointer-events: none;
      overflow: hidden;
    }
    .mp {
      position: absolute;
      pointer-events: none;
      user-select: none;
      will-change: transform, opacity;
      line-height: 1;
    }

    /* ── Floating petals on card ── */
    .floating-petal {
      animation: petalFloat 5.5s ease-in-out infinite;
    }
    @keyframes petalFloat {
      0%,100% { transform: translateY(0) rotate(0deg) scale(1); opacity: 0.7; }
      33%      { transform: translateY(-14px) rotate(10deg) scale(1.05); opacity: 1; }
      66%      { transform: translateY(-6px) rotate(-5deg) scale(0.97); opacity: 0.85; }
    }

    /* ── Heart ── */
    .heart-scene {
      position: relative; display: inline-flex;
      align-items: center; justify-content: center;
      width: min(16rem,68vw); aspect-ratio: 1;
      border: 0; background: transparent; cursor: pointer;
      transition: transform 0.45s ease;
      margin-top: 2.5rem;
    }
    .heart-scene:hover { transform: translateY(-5px) scale(1.02); }
    .heart-scene--opening { animation: heartMorphOut 0.85s cubic-bezier(0.4,0,0.2,1) forwards; }
    .heart-ring {
      position: absolute; inset: 9%; border-radius: 50%;
      border-width: 1px; border-style: solid;
      animation: pulseRing 3.2s ease-in-out infinite;
    }
    .heart-ring--two { inset: 1%; animation-delay: 1.4s; }
    .heart-core {
      position: relative; width: 56%; aspect-ratio: 1;
      transform: rotate(-45deg); border-radius: 26%;
      animation: floatHeart 4.6s ease-in-out infinite;
    }
    .heart-core::before,.heart-core::after {
      content:""; position: absolute;
      width: 100%; height: 100%;
      border-radius: 50%; background: inherit;
    }
    .heart-core::before { top:-50%; left:0; }
    .heart-core::after  { top:0; left:50%; }
    .heart-core__content {
      position: absolute; inset: 0; z-index: 2;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      transform: rotate(45deg);
    }
    .heart-mark { font-size: clamp(2rem,5vw,3rem); line-height:1; color:rgba(255,255,255,0.95); text-shadow: 0 6px 20px rgba(0,0,0,0.2); }
    @keyframes pulseRing {
      0%,100% { opacity:0.22; transform:scale(0.93); }
      50%      { opacity:0.55; transform:scale(1.05); }
    }
    @keyframes floatHeart {
      0%,100% { transform: rotate(-45deg) translateY(0); }
      50%      { transform: rotate(-45deg) translateY(-13px); }
    }
    @keyframes heartMorphOut {
      0%   { opacity:1; transform:scale(1) rotate(0deg); filter:blur(0); }
      35%  { opacity:1; transform:scale(1.09) rotate(3deg); }
      100% { opacity:0; transform:scale(0.65) rotate(-8deg); filter:blur(12px); }
    }

    /* ── Letter appear ── */
    .letter-appear { animation: letterAppear 0.7s cubic-bezier(0.2,0.8,0.2,1) both; }
    @keyframes letterAppear {
      0%   { opacity:0; transform:translateY(32px) scale(0.93) rotateX(-12deg); }
      100% { opacity:1; transform:translateY(0) scale(1) rotateX(0deg); }
    }

    /* ── Envelope ── */
    .closing-envelope {
      position:relative; width:min(22rem,85vw); aspect-ratio:1.18;
      animation: envelopeLift 1.9s ease forwards;
    }
    .closing-envelope__back,.closing-envelope__front,.closing-envelope__flap,
    .closing-envelope__paper,.closing-envelope__seal { position:absolute; }
    .closing-envelope__back { inset:18% 0 0; border-radius:1.8rem; box-shadow:0 30px 80px rgba(0,0,0,0.25); }
    .closing-envelope__paper {
      left:8%;right:8%;top:2%;bottom:30%;border-radius:1.4rem;
      padding:1.2rem;overflow:hidden;
      animation: paperSlideIn 0.4s ease, paperSlideOut 0.9s ease 0.5s forwards;
    }
    .closing-envelope__front { left:0;right:0;bottom:0;height:56%;border-radius:0 0 1.8rem 1.8rem; clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%); }
    .closing-envelope__flap { left:0;right:0;top:18%;height:48%;transform-origin:top;border-radius:1.8rem 1.8rem 0 0; clip-path:polygon(0 0,50% 90%,100% 0); animation: flapClose 0.85s cubic-bezier(0.4,0,0.2,1) 0.35s forwards; }
    .closing-envelope__seal {
      left:50%;top:57%;z-index:2;display:grid;place-items:center;
      width:3.8rem;aspect-ratio:1;transform:translate(-50%,-50%) scale(0);
      border-radius:999px;font-size:1.3rem;font-weight:900;
      box-shadow:0 16px 40px rgba(0,0,0,0.3);
      animation: sealPop 0.5s cubic-bezier(0.34,1.56,0.64,1) 0.98s forwards;
    }
    @keyframes envelopeLift {
      0%   { transform:translateY(30px) scale(0.92); opacity:0; }
      20%  { transform:translateY(0) scale(1); opacity:1; }
      80%  { transform:translateY(-6px) scale(1); opacity:1; }
      100% { transform:translateY(-28px) scale(0.94); opacity:0; }
    }
    @keyframes paperSlideIn  { from { transform:translateY(15%); } to { transform:translateY(0); } }
    @keyframes paperSlideOut { from { transform:translateY(0); } to { transform:translateY(24%); } }
    @keyframes flapClose { 0% { transform:rotateX(175deg); } 100% { transform:rotateX(0deg); } }
    @keyframes sealPop {
      0%   { transform:translate(-50%,-50%) scale(0); }
      75%  { transform:translate(-50%,-50%) scale(1.12); }
      100% { transform:translate(-50%,-50%) scale(1); }
    }

    /* ── Utility ── */
    .font-playfair { font-family: 'Playfair Display', serif; }
    @media (max-width: 640px) { .heart-scene { width:min(14rem,75vw); } }
  </style>
</head>
<body>
  <!-- Live wallpaper canvas -->
  <canvas id="wallpaper-canvas"></canvas>
  <!-- Mouse particles -->
  <div id="mouse-particles"></div>
  <div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;

// ══════════════════════════════════════════════════════
//  LIVE WALLPAPER ENGINE
// ══════════════════════════════════════════════════════
const WallpaperEngine = (() => {
  let canvas, ctx, W, H, raf;
  let currentTheme = 'rose';
  let targetTheme = 'rose';
  let transitionProgress = 1;
  let particles = [];
  let time = 0;

  const THEME_COLORS = {
    rose:  { bg: '#0d0409', orb1: [210,65,128], orb2: [180,40,100], orb3: [240,100,150], particle: [255,160,200] },
    blue:  { bg: '#020810', orb1: [40,100,220], orb2: [60,80,200],  orb3: [80,140,240], particle: [120,180,255] },
    dark:  { bg: '#080608', orb1: [160,110,20], orb2: [140,90,10],  orb3: [200,150,40], particle: [220,180,80]  },
    green: { bg: '#030a05', orb1: [40,140,80],  orb2: [30,120,60],  orb3: [60,180,100], particle: [100,220,140] },
  };

  function lerp(a,b,t){ return a+(b-a)*t; }
  function lerpColor(c1,c2,t){ return c1.map((v,i)=>Math.round(lerp(v,c2[i],t))); }
  function rgba(c,a){ return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }

  // Floating symbol particles for wallpaper
  const SYMBOLS = {
    rose: ['🌸','🌺','💗','✿','❀','🌷','💕'],
    blue: ['💙','❄️','✦','💫','🌊','⭐','🫧'],
    dark: ['✦','⭐','🌟','💛','✨','🌙','💫'],
    green:['🌿','🍃','🌱','❀','✿','💚','🌸'],
  };

  function initParticles(theme) {
    particles = Array.from({length:18}, (_,i) => ({
      x: Math.random() * W,
      y: Math.random() * H,
      vy: -(0.15 + Math.random() * 0.35),
      vx: (Math.random()-0.5) * 0.2,
      size: 0.9 + Math.random() * 1.4,
      opacity: 0.08 + Math.random() * 0.18,
      rotation: Math.random()*360,
      rotSpeed: (Math.random()-0.5) * 0.4,
      emoji: SYMBOLS[theme][i % SYMBOLS[theme].length],
      phase: Math.random() * Math.PI * 2,
    }));
  }

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  function drawOrb(x, y, r, color, alpha) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, rgba(color, alpha));
    g.addColorStop(0.5, rgba(color, alpha * 0.4));
    g.addColorStop(1, rgba(color, 0));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  function renderFrame() {
    time += 0.003;

    // Smooth theme transition
    if (transitionProgress < 1) {
      transitionProgress = Math.min(1, transitionProgress + 0.018);
    } else {
      currentTheme = targetTheme;
    }

    const ct = THEME_COLORS[currentTheme];
    const tt = THEME_COLORS[targetTheme];
    const tp = transitionProgress;

    // Interpolate bg hex (simplified — just use dark base)
    ctx.clearRect(0, 0, W, H);

    // Background fill
    const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
    bgGrad.addColorStop(0, lerpHex(ct.bg, tt.bg, tp));
    bgGrad.addColorStop(1, '#06030a');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);

    // Animated orbs
    const orb1x = W * 0.15 + Math.sin(time * 0.7) * W * 0.08;
    const orb1y = H * 0.15 + Math.cos(time * 0.5) * H * 0.08;
    const orb2x = W * 0.82 + Math.cos(time * 0.6) * W * 0.07;
    const orb2y = H * 0.55 + Math.sin(time * 0.8) * H * 0.1;
    const orb3x = W * 0.5  + Math.sin(time * 0.4) * W * 0.12;
    const orb3y = H * 0.85 + Math.cos(time * 0.9) * H * 0.06;

    const c1 = lerpColor(ct.orb1, tt.orb1, tp);
    const c2 = lerpColor(ct.orb2, tt.orb2, tp);
    const c3 = lerpColor(ct.orb3, tt.orb3, tp);
    const pc = lerpColor(ct.particle, tt.particle, tp);

    drawOrb(orb1x, orb1y, Math.min(W,H) * 0.42, c1, 0.28);
    drawOrb(orb2x, orb2y, Math.min(W,H) * 0.34, c2, 0.20);
    drawOrb(orb3x, orb3y, Math.min(W,H) * 0.38, c3, 0.18);

    // Central soft glow
    const cx = W/2 + Math.sin(time*0.3)*W*0.05;
    const cy = H/2 + Math.cos(time*0.4)*H*0.04;
    drawOrb(cx, cy, Math.min(W,H)*0.55, c1, 0.06);

    // Dot grid overlay
    ctx.save();
    ctx.globalAlpha = 0.12;
    ctx.fillStyle = rgba(pc, 0.5);
    const gs = 38;
    for (let x=0; x<W+gs; x+=gs) {
      for (let y=0; y<H+gs; y+=gs) {
        const pulse = 0.5 + 0.5 * Math.sin(time * 1.5 + x * 0.04 + y * 0.03);
        ctx.globalAlpha = 0.04 + pulse * 0.06;
        ctx.beginPath();
        ctx.arc(x, y, 1 + pulse * 0.5, 0, Math.PI*2);
        ctx.fill();
      }
    }
    ctx.restore();

    // Diagonal shimmer lines
    ctx.save();
    ctx.globalAlpha = 0.04;
    ctx.strokeStyle = rgba(pc, 0.8);
    ctx.lineWidth = 0.5;
    const lineSpacing = 80;
    const offset = (time * 15) % lineSpacing;
    for (let i = -H; i < W + H; i += lineSpacing) {
      ctx.beginPath();
      ctx.moveTo(i + offset, 0);
      ctx.lineTo(i + offset + H, H);
      ctx.stroke();
    }
    ctx.restore();

    // Floating emoji particles
    ctx.save();
    for (const p of particles) {
      p.x += p.vx + Math.sin(time + p.phase) * 0.15;
      p.y += p.vy;
      p.rotation += p.rotSpeed;
      if (p.y < -60) { p.y = H + 40; p.x = Math.random() * W; }
      if (p.x < -40) p.x = W + 40;
      if (p.x > W + 40) p.x = -40;

      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rotation * Math.PI / 180);
      ctx.globalAlpha = p.opacity * (0.7 + 0.3 * Math.sin(time * 1.2 + p.phase));
      ctx.font = `${p.size}rem 'Segoe UI Emoji', 'Apple Color Emoji', serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(p.emoji, 0, 0);
      ctx.restore();
    }
    ctx.restore();

    // Vignette
    const vig = ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*0.75);
    vig.addColorStop(0.4, 'rgba(0,0,0,0)');
    vig.addColorStop(1, 'rgba(0,0,0,0.65)');
    ctx.fillStyle = vig;
    ctx.fillRect(0,0,W,H);

    raf = requestAnimationFrame(renderFrame);
  }

  function lerpHex(h1, h2, t) {
    // Simple approach: just fade through black
    const r1 = parseInt(h1.slice(1,3),16), g1=parseInt(h1.slice(3,5),16), b1=parseInt(h1.slice(5,7),16);
    const r2 = parseInt(h2.slice(1,3),16), g2=parseInt(h2.slice(3,5),16), b2=parseInt(h2.slice(5,7),16);
    const r=Math.round(r1+(r2-r1)*t), g=Math.round(g1+(g2-g1)*t), b=Math.round(b1+(b2-b1)*t);
    return `rgb(${r},${g},${b})`;
  }

  return {
    init(theme='rose') {
      canvas = document.getElementById('wallpaper-canvas');
      ctx = canvas.getContext('2d');
      currentTheme = targetTheme = theme;
      resize();
      initParticles(theme);
      window.addEventListener('resize', ()=>{ resize(); });
      renderFrame();
    },
    setTheme(theme) {
      if (theme === targetTheme) return;
      currentTheme = targetTheme;
      targetTheme = theme;
      transitionProgress = 0;
      // Update particle emojis
      particles.forEach((p,i) => { p.emoji = SYMBOLS[theme][i % SYMBOLS[theme].length]; });
    },
    destroy() { if(raf) cancelAnimationFrame(raf); }
  };
})();

// ══════════════════════════════════════════════════════
//  MOUSE PARTICLE ENGINE
// ══════════════════════════════════════════════════════
const MouseEngine = (() => {
  let container, particles = [], pid = 0, raf, running = false;
  let currentSymbols = ['🌸','💗','✿','❀','♡','❤','✦'];
  let currentColor = 'rgba(230,130,160,0.9)';
  let currentGlow = 'rgba(210,65,128,0.6)';
  let lastX = -999, lastY = -999;

  const THEME_META = {
    rose:  { symbols:['🌸','🌺','💗','✿','❀','🌷','♡','❤'], color:'rgba(230,130,160,0.9)', glow:'rgba(210,65,128,0.6)' },
    blue:  { symbols:['💙','❄️','✦','💫','⭐','✿','♡','🫧'], color:'rgba(80,150,230,0.9)',  glow:'rgba(60,120,220,0.6)' },
    dark:  { symbols:['✦','⭐','🌟','💛','✨','🌙','💫','♡'], color:'rgba(210,170,70,0.9)',  glow:'rgba(180,130,30,0.6)' },
    green: { symbols:['🌿','🍃','🌱','❀','✿','💚','♡','🌸'], color:'rgba(60,170,110,0.9)',  glow:'rgba(50,140,90,0.6)' },
  };

  function spawn(x, y) {
    const count = 3;
    for (let i=0;i<count;i++) {
      const el = document.createElement('span');
      el.className = 'mp';
      const sym = currentSymbols[Math.floor(Math.random()*currentSymbols.length)];
      el.textContent = sym;
      const size = 0.85 + Math.random() * 1.0;
      const angle = Math.random() * Math.PI * 2;
      const speed = 1.5 + Math.random() * 3;
      const vx = Math.cos(angle) * speed * (Math.random() < 0.5 ? 0.6 : 1);
      const vy = -(1.5 + Math.random() * 3.5);
      const life = 60 + Math.floor(Math.random() * 50);
      el.style.cssText = `font-size:${size}rem;color:${currentColor};text-shadow:0 0 10px ${currentGlow};`;
      container.appendChild(el);
      particles.push({ el, x, y, vx, vy, life, maxLife: life, rot: Math.random()*360, rotS: (Math.random()-0.5)*5 });
    }
  }

  function tick() {
    for (let i = particles.length-1; i>=0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.09;
      p.vx *= 0.97;
      p.rot += p.rotS;
      p.life--;
      const prog = p.life / p.maxLife;
      const opacity = prog < 0.2 ? prog/0.2 : prog;
      const scale = 0.4 + prog * 0.6;
      p.el.style.transform = `translate(${p.x}px,${p.y}px) translate(-50%,-50%) rotate(${p.rot}deg) scale(${scale})`;
      p.el.style.opacity = opacity;
      if (p.life <= 0) {
        p.el.remove();
        particles.splice(i,1);
      }
    }
    raf = requestAnimationFrame(tick);
  }

  return {
    init() {
      container = document.getElementById('mouse-particles');
      // Reset all positions to origin, we use transform for positioning
      window.addEventListener('mousemove', e => {
        const dx = e.clientX - lastX, dy = e.clientY - lastY;
        if (dx*dx + dy*dy < 25) return;
        lastX = e.clientX; lastY = e.clientY;
        // Spawn at fixed 0,0 and use transform to position
        const p_base = particles.length;
        spawn(0, 0);
        // Fix: actually position at cursor
        for (let i = p_base; i < particles.length; i++) {
          particles[i].x = e.clientX;
          particles[i].y = e.clientY;
        }
      }, {passive:true});
      if (!running) { running = true; tick(); }
    },
    setTheme(t) {
      const m = THEME_META[t] || THEME_META.rose;
      currentSymbols = m.symbols;
      currentColor = m.color;
      currentGlow = m.glow;
    }
  };
})();

// ══════════════════════════════════════════════════════
//  REACT APP
// ══════════════════════════════════════════════════════
const THEMES = {
  rose: {
    id:"rose",label:"Qızılgül",emoji:"🌸",tagline:"romantik • zərif • sevgi dolu",
    defaultRelation:"Sevgilim",
    defaultMessage:"Canım, 8 Martın mübarək. Sənin səsin, gülüşün və qəlbin həyatımın ən zərif hissəsidir. Hər günümə işıq, hər anıma sevgi qatdığın üçün sənə minnətdaram. Sən olmasan bu dünya solğun olardı — sevgin hər yerdə çiçək kimi açır.",
    paperBg:"linear-gradient(160deg,#fff0f6 0%,#fff8f2 50%,#fef0f5 100%)",
    paperBorder:"rgba(230,150,180,0.45)",paperText:"#5a1e3e",paperSubtext:"#7c4060",
    paperInputBg:"rgba(255,255,255,0.85)",paperInputBorder:"#e8b8cc",paperInputText:"#5a1e3e",
    envelopeBack:"linear-gradient(180deg,#ffe4ef,#f5b8d0)",
    envelopeFront:"linear-gradient(180deg,#f0b0c8,#d4708e)",
    envelopeFlap:"linear-gradient(160deg,#ffd6e8,#e896b8)",
    envelopeSeal:"linear-gradient(135deg,#9f315f,#d46b98,#ffb0c8)",sealGlyph:"♥",
    heartCore:"radial-gradient(circle at 35% 35%,rgba(255,238,245,0.97),rgba(255,183,214,0.97) 42%,rgba(210,70,130,0.99) 80%)",
    heartRingColor:"rgba(255,180,210,0.28)",heartGlow:"rgba(210,65,128,0.5)",
    petals:["🌸","🌺","💗","✿","❀","🌷","💕","🌸"],petalColor:"rgba(230,130,160,0.7)",
    readBg:"#fff6fb",readCardBg:"linear-gradient(160deg,#fffafd,#ffe8f5)",readAccent:"#e06090",readText:"#5a2443",
  },
  blue: {
    id:"blue",label:"Göy Üfüq",emoji:"💙",tagline:"sakit • dərin • sonsuz",
    defaultRelation:"Anam",
    defaultMessage:"Əziz anam, 8 Martın mübarək. Sənin sevgin, qayğın və gücün mənim üçün hər zaman ən böyük dayaq olub. Sən göy üzü kimi geniş, dəniz kimi dərinsin. Həyatımda olduğun üçün sonsuz təşəkkür edirəm.",
    paperBg:"linear-gradient(160deg,#f0f6ff 0%,#f5f0ff 50%,#edf6ff 100%)",
    paperBorder:"rgba(120,160,230,0.45)",paperText:"#1a3060",paperSubtext:"#3a5090",

  {code:"1",flag:"🇺🇸",label:"US"},
];
const SUSPICIOUS_PATTERNS=[/https?:\/\//i,/bit\.ly|tinyurl|t\.me|telegram|discord\.gg/i,/şifrə|sifre|password|pin\b|kart\s*no/i,/banka|bank|hesab/i,/pul\s*köçür|pul\s*göndər/i,/linkə\s*tıkla|linkə\s*kliklə/i];

function generateCaptcha(){const a=Math.floor(Math.random()*9)+1,b=Math.floor(Math.random()*9)+1;return{question:`${a} + ${b} = ?`,answer:String(a+b)};}
function sanitizePhone(v){return v.replace(/[^0-9]/g,'').slice(0,15);}
function encodePayload(p){try{const c={r:p.recipientName,rel:p.relationship,s:p.senderName,m:p.message,t:p.theme};return btoa(encodeURIComponent(JSON.stringify(c)));}catch{return null;}}
function decodePayload(v){try{const raw=JSON.parse(decodeURIComponent(atob(v)));const p=raw.m!==undefined?{recipientName:raw.r,relationship:raw.rel,senderName:raw.s,message:raw.m,theme:raw.t}:raw;if(!['rose','blue','dark','green'].includes(p.theme))return null;return p;}catch{return null;}}
function isSuspicious(p){const t=[p.message,p.recipientName,p.senderName,p.relationship].join(' ');return SUSPICIOUS_PATTERNS.some(r=>r.test(t));}

  const [shareUrl,setShareUrl]=useState('');
  const [copyState,setCopyState]=useState('idle');
  const [phoneError,setPhoneError]=useState(false);
  const [countryCode,setCountryCode]=useState('994');
  const [showCountryPicker,setShowCountryPicker]=useState(false);
  const [rateLimitHit,setRateLimitHit]=useState(false);
  const [sendCount,setSendCount]=useState(0);
  const [lastSendTime,setLastSendTime]=useState(0);
  const [captcha,setCaptcha]=useState(generateCaptcha);
  const [captchaInput,setCaptchaInput]=useState('');
  const [captchaError,setCaptchaError]=useState(false);
  const [showCaptcha,setShowCaptcha]=useState(false);
  const openTimer=useRef(null),stageTimer=useRef(null);
  const theme=THEMES[selectedTheme],isDark=selectedTheme==='dark';

  // Init engines
  useEffect(()=>{
    WallpaperEngine.init('rose');
    MouseEngine.init();
    return ()=>WallpaperEngine.destroy();
  },[]);

  // URL decode
  useEffect(()=>{
    const params=new URLSearchParams(window.location.search);
    const encoded=params.get('l')||params.get('letter');
    if(!encoded)return;
    const decoded=decodePayload(encoded);
    if(!decoded)return;
    if(isSuspicious(decoded)){setSuspicious(true);setMode('read');return;}
    setReadPayload(decoded);setMode('read');
  },[]);

  // Theme change → wallpaper + mouse
  useEffect(()=>{
    WallpaperEngine.setTheme(selectedTheme);
    MouseEngine.setTheme(selectedTheme);
  },[selectedTheme]);

  const normalizedPhone=useMemo(()=>(countryCode+phone.replace(/[^0-9]/g,'')),[phone,countryCode]);
  const isPhoneValid=normalizedPhone.length>=(countryCode.length+6)&&normalizedPhone.length<=(countryCode.length+12);
  const phoneOk=!phone||isPhoneValid;
  const canSend=Boolean(message.trim())&&phoneOk;
  const liveExcerpt=useMemo(()=>{const t=message.trim();if(!t)return'Məktubun mətni burada görünəcək.';return t.length>160?`${t.slice(0,160)}…`:t;},[message]);

  const generateShareUrl=()=>{
    const p={recipientName:recipientName.trim()||'Mənim ən dəyərli insanım',relationship:relationship.trim()||theme.defaultRelation,senderName:senderName.trim()||'Səni sevən biri',message:message.trim(),theme:selectedTheme};
    const encoded=encodePayload(p);
    if(!encoded)return window.location.origin+window.location.pathname;
    const url=new URL(window.location.href);url.searchParams.set('l',encoded);return url.toString();
  };

  const applyTheme=(key)=>{setSelectedTheme(key);setMessage(THEMES[key].defaultMessage);setRelationship('');};
  const openLetter=()=>{if(stage!=='heart')return;setStage('opening');openTimer.current=setTimeout(()=>setStage('letter'),820);};

  const handleSend=()=>{
    if(!canSend)return;
    if(phone&&!isPhoneValid){setPhoneError(true);setTimeout(()=>setPhoneError(false),4000);return;}
    setPhoneError(false);
    const now=Date.now();
    if(now-lastSendTime<60000&&sendCount>=5){setRateLimitHit(true);setTimeout(()=>setRateLimitHit(false),10000);return;}
    if(sendCount%5===0){setCaptcha(generateCaptcha());setCaptchaInput('');setCaptchaError(false);setShowCaptcha(true);return;}
    doSend();
  };

  const doSend=()=>{
    setShowCaptcha(false);setSendCount(c=>c+1);setLastSendTime(Date.now());

      React.createElement('p',{style:{marginTop:'8px',fontSize:'14px',textAlign:'center',color:'rgba(255,255,255,0.6)'}},'Zəhmət olmasa aşağıdakı sualı cavablandır:'),
